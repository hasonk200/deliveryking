<!-- ═══════════ UX 互動與動畫層（4.35 專屬動態） ═══════════ -->
<script>
(()=>{
 const root=document.documentElement;
 const update=()=>{const h=document.documentElement.scrollHeight-innerHeight;root.style.setProperty('--scroll',(h>0?(scrollY/h*100):0)+'%')};
 addEventListener('scroll',update,{passive:true}); update();
 document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');c.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}));
  const side = document.querySelector('#sidebar'), ham = document.querySelector('#hamb');

 const closeMobileSidebar = () => {
   if (side) side.classList.remove('open');
   document.body.classList.remove('side-open');
 };

 if (ham && side) {
   ham.onclick = (e) => {
     e.stopPropagation();
     const willOpen = !side.classList.contains('open');
     side.classList.toggle('open', willOpen);
     document.body.classList.toggle('side-open', willOpen);
   };
   document.querySelectorAll('.nav-btn').forEach(b => {
     b.addEventListener('click', closeMobileSidebar);
   });
 }

 document.addEventListener('click', e => {
   if (!side) return;
   const isOpen = side.classList.contains('open') || document.body.classList.contains('side-open');
   if (!isOpen) return;
   if (ham && ham.contains(e.target)) return;
   if (side.contains(e.target) && e.clientX <= side.offsetWidth) return;

   e.preventDefault();
   e.stopPropagation();
   closeMobileSidebar();
 }, true);
 const observer=new MutationObserver(()=>document.querySelectorAll('.big,.live-clock,.tile .val,.pcard .hourly').forEach(el=>{if(!el.classList.contains('metric-pop')){el.classList.add('metric-pop');setTimeout(()=>el.classList.remove('metric-pop'),500)}}));
 observer.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>
